* { box-sizing: border-box; }
html, body { width: 720pt; height: 405pt; margin: 0; padding: 0; }
body {

.flow-card p { margin: 0; font-size: 8.5pt; line-height: 1.2; }
.arrow { width: 18pt; align-self: center; color: #D97A34; font-size: 16pt; font-weight: bold; }
.listbox { background: #FFFFFF; padding: 10pt 13pt; border-radius: 6pt; }
ul { margin: 0; padding-left: 17pt; }
li { margin: 0 0 4pt; color: #233541; font-size: 9pt; line-height: 1.25; }
.matrix { display:flex; flex-direction:column; width:100%; background:#FFFFFF; border:1px solid #C9D5DB; }
.mrow { display:flex; }

.mcell p { color:#233541; font-size:8pt; line-height:1.15; margin:0; }
.mhead { background:#173247; }
.mhead .mcell p { color:#FFFFFF; font-weight:bold; text-align:center; }
.status { background: #FFF4E7; border-left: 5pt solid #D97A34; padding: 9pt 11pt; }
.status p { margin: 0; color: #233541; font-size: 9pt; line-height: 1.25; }
